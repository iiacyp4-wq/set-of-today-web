<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover: 홈 화면 앱(전체 화면)에서 노치·홈 인디케이터 영역까지 그리고, 안전영역은 앱이 env()로 읽어 비운다 (2026-10-03) -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, shrink-to-fit=no" />
    <title>Set of Today</title>

    <!-- 사파리 "홈 화면에 추가" 설정: 주소창 없는 전체 화면 앱으로 열린다 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Set of Today" />
    <meta name="theme-color" content="#161A25" />
    <link rel="apple-touch-icon" href="/set-of-today-web/apple-touch-icon.png" />
    <link rel="manifest" href="/set-of-today-web/manifest.webmanifest" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        /* 앱 배경색 — 로딩 중·고무줄 스크롤 때 흰 화면이 번쩍이지 않게 */
        background-color: #161a25;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
        /* 홈 화면 앱에서 화면 전체가 튕기듯 끌리는 것 방지 */
        overscroll-behavior: none;
        -webkit-touch-callout: none;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  <link rel="icon" href="/set-of-today-web/favicon.ico"/></head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>

    <!-- 새 버전 자동 반영 (2026-10-03): 깃허브 페이지가 index.html을 10분 캐시하고, 홈 화면 앱은 페이지를
         오래 붙들고 있어서 새로 배포해도 폰에 안 바뀌던 문제. 열릴 때·다시 앞으로 올 때마다 서버의
         index.html을 캐시 없이 받아 번들 파일 이름이 다르면 한 번 새로고침한다. -->
    <script>
      (function () {
        var BASE = '/set-of-today-web/';
        var LAST_KEY = 'sot-reload-at';
        function currentEntry() {
          var el = document.querySelector('script[src*="/entry-"]');
          var m = el && el.getAttribute('src').match(/entry-[a-f0-9]+\.js/);
          return m ? m[0] : null;
        }
        function check() {
          var cur = currentEntry();
          if (!cur || !navigator.onLine) return;
          fetch(BASE + 'index.html?_=' + Date.now(), { cache: 'no-store' })
            .then(function (r) { return r.ok ? r.text() : ''; })
            .then(function (html) {
              var m = html.match(/entry-[a-f0-9]+\.js/);
              if (!m || m[0] === cur) return;
              var last = Number(sessionStorage.getItem(LAST_KEY) || 0);
              if (Date.now() - last < 60000) return; // 1분 안에 두 번 새로고침하지 않음 (루프 방지)
              sessionStorage.setItem(LAST_KEY, String(Date.now()));
              location.replace(BASE + '?r=' + Date.now());
            })
            .catch(function () {});
        }
        window.addEventListener('load', check);
        document.addEventListener('visibilitychange', function () { if (!document.hidden) check(); });
      })();
    </script>
  <script src="/set-of-today-web/_expo/static/js/web/entry-aef489af33c9b6885ee175573d5b3a07.js" defer></script>
</body>
</html>
